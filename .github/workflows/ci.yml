name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    # app/config.py reads these at import time, and the Anthropic client is
    # built when app.receptionist is imported. CI has no real keys and the
    # tests never call an external API, so placeholders are enough.
    env:
      ANTHROPIC_API_KEY: dummy-ci-key
      ANTHROPIC_MODEL: claude-haiku-5-5
      ELEVENLABS_API_KEY: dummy-ci-key
      ELEVENLABS_VOICE_ID: dummy-ci-voice

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      # ruff is pinned so a new release adding default rules can't fail the build without a code change.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -r requirements.txt ruff==0.17.6 bandit pip-audit

      - name: Seed the database
        run: python -m data.seed

      - name: Lint (ruff)
        run: ruff check .

      - name: Security scan (bandit)
        run: bandit -r app -ll

      # continue-on-error is a safeguard: if a transitive dependency ever has
      # a CVE with no fix released, it shouldn't block every build when
      # there's nothing we can do about it here. Findings are still reported:
      # the step shows them in the log and is marked failed, but the job passes.
      - name: Dependency audit (pip-audit)
        run: pip-audit
        continue-on-error: true

      - name: Tests (pytest)
        run: pytest -v
