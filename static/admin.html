<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kestrel Front Desk — Admin</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      background: #f5f7fa;
      color: #1c1c1e;
      padding: 40px 48px;
    }

    /* ── Page header ── */
    .page-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 40px;
      border-bottom: 2px solid #1a3a5c;
      padding-bottom: 16px;
    }

    .page-header h1 {
      font-size: 20px;
      font-weight: 700;
      color: #1a3a5c;
      letter-spacing: -0.3px;
    }

    .page-header .meta {
      font-size: 12px;
      color: #888;
    }

    /* ── Section ── */
    section { margin-bottom: 48px; }

    section h2 {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #1a3a5c;
      margin-bottom: 10px;
    }

    /* ── Table ── */
    .table-wrap { overflow-x: auto; }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      border: 1px solid #dde3ec;
      border-radius: 6px;
      overflow: hidden;
    }

    thead th {
      background: #1a3a5c;
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 10px 14px;
      text-align: left;
      white-space: nowrap;
    }

    tbody tr { border-bottom: 1px solid #edf0f5; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:nth-child(even) td { background: #fafbfd; }
    tbody tr:hover td { background: #f0f4f9; }

    td {
      padding: 10px 14px;
      vertical-align: top;
    }

    .num   { font-variant-numeric: tabular-nums; }
    .mono  { font-family: ui-monospace, monospace; font-size: 12px; color: #555; }
    .dim   { color: #888; }
    .wrap  { max-width: 340px; }
    .nowrap { white-space: nowrap; }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
    }

    .badge-esc  { background: #fde8e8; color: #991b1b; }
    .badge-tool { background: #e8f0fe; color: #1a3a5c; font-family: ui-monospace, monospace; font-size: 11px; }

    .empty td {
      color: #aaa;
      font-style: italic;
      text-align: center;
      padding: 24px;
    }
  </style>
</head>
<body>

<div class="page-header">
  <h1>Kestrel Community Recreation &mdash; Front Desk Admin</h1>
  <span class="meta" id="ts"></span>
</div>

<section>
  <h2>Messages taken</h2>
  <div class="table-wrap">
    <table id="tbl-messages">
      <thead><tr>
        <th>Ref</th>
        <th>Received</th>
        <th>Caller</th>
        <th>Callback</th>
        <th>Centre</th>
        <th>Topic</th>
      </tr></thead>
      <tbody><tr class="empty"><td colspan="6">Loading&hellip;</td></tr></tbody>
    </table>
  </div>
</section>

<section>
  <h2>Recent conversations</h2>
  <div class="table-wrap">
    <table id="tbl-conv">
      <thead><tr>
        <th>Time</th>
        <th>Caller said</th>
        <th>Agent replied</th>
        <th>Tools</th>
        <th>Escalated</th>
      </tr></thead>
      <tbody><tr class="empty"><td colspan="5">Loading&hellip;</td></tr></tbody>
    </table>
  </div>
</section>

<section>
  <h2>Topics by frequency</h2>
  <div class="table-wrap">
    <table id="tbl-topics">
      <thead><tr>
        <th>Topic</th>
        <th style="width:80px">Count</th>
      </tr></thead>
      <tbody><tr class="empty"><td colspan="2">Loading&hellip;</td></tr></tbody>
    </table>
  </div>
</section>

<script>
  /* ── Formatting helpers ── */
  function fmt(iso) {
    if (!iso) return '—';
    const d = new Date(iso.endsWith('Z') ? iso : iso + 'Z');
    return d.toLocaleString('en-AU', {
      day: '2-digit', month: 'short', year: 'numeric',
      hour: '2-digit', minute: '2-digit', hour12: false,
    });
  }

  function esc(s) {
    if (s == null) return '<span class="dim">—</span>';
    return String(s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function clip(s, n) {
    if (!s) return '';
    return s.length > n ? s.slice(0, n) + '…' : s;
  }

  /* ── Fetch + render ── */
  async function load(url, render) {
    try {
      const r = await fetch(url);
      render(await r.json());
    } catch (e) {
      console.error(url, e);
    }
  }

  function renderMessages(rows) {
    const tb = document.querySelector('#tbl-messages tbody');
    if (!rows.length) {
      tb.innerHTML = '<tr class="empty"><td colspan="6">No messages yet.</td></tr>';
      return;
    }
    tb.innerHTML = rows.map(r => `<tr>
      <td class="num dim">${r.id}</td>
      <td class="mono nowrap">${fmt(r.created_at)}</td>
      <td>${esc(r.name)}</td>
      <td class="mono nowrap">${esc(r.phone)}</td>
      <td>${esc(r.centre)}</td>
      <td>${esc(r.topic)}</td>
    </tr>`).join('');
  }

  function renderConversations(rows) {
    const tb = document.querySelector('#tbl-conv tbody');
    if (!rows.length) {
      tb.innerHTML = '<tr class="empty"><td colspan="5">No conversations yet.</td></tr>';
      return;
    }
    tb.innerHTML = rows.map(r => {
      let escalated = false;
      try { escalated = JSON.parse(r.tool_input || '{}').escalated; } catch (_) {}

      let tools = '';
      try {
        const t = JSON.parse(r.tools || '[]');
        tools = t.map(n => `<span class="badge badge-tool">${esc(n)}</span>`).join(' ');
      } catch (_) {}

      return `<tr>
        <td class="mono nowrap">${fmt(r.created_at)}</td>
        <td class="wrap">${esc(clip(r.caller_said,   100))}</td>
        <td class="wrap">${esc(clip(r.agent_replied, 120))}</td>
        <td style="white-space:nowrap">${tools || '<span class="dim">—</span>'}</td>
        <td>${escalated ? '<span class="badge badge-esc">Yes</span>' : '<span class="dim">—</span>'}</td>
      </tr>`;
    }).join('');
  }

  function renderTopics(rows) {
    const tb = document.querySelector('#tbl-topics tbody');
    if (!rows.length) {
      tb.innerHTML = '<tr class="empty"><td colspan="2">No messages yet.</td></tr>';
      return;
    }
    tb.innerHTML = rows.map(r => `<tr>
      <td>${esc(r.topic)}</td>
      <td class="num"><strong>${r.count}</strong></td>
    </tr>`).join('');
  }

  /* ── Boot ── */
  document.getElementById('ts').textContent =
    'Loaded ' + new Date().toLocaleTimeString('en-AU', { hour: '2-digit', minute: '2-digit' });

  load('/api/admin/messages',     renderMessages);
  load('/api/admin/conversations', renderConversations);
  load('/api/admin/topics',        renderTopics);
</script>

</body>
</html>
